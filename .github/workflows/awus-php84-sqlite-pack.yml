name: AWUS PHP 8.4 SQLite QA Pack

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP 8.4 SQLite extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Package exact ABI extensions
        run: |
          set -euxo pipefail
          EXT_DIR="$(php-config --extension-dir)"
          mkdir -p pack/extensions
          for ext in pdo_sqlite sqlite3; do
            test -f "$EXT_DIR/$ext.so"
            cp "$EXT_DIR/$ext.so" pack/extensions/
          done
          php -i | grep '^PHP API' | head -1 > pack/php-api.txt
          tar -czf AWUS-PHP84-SQLITE-QA.tar.gz -C pack .
          sha256sum AWUS-PHP84-SQLITE-QA.tar.gz > AWUS-PHP84-SQLITE-QA.sha256
      - name: Upload QA runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: AWUS-PHP84-SQLITE-QA
          path: |
            AWUS-PHP84-SQLITE-QA.tar.gz
            AWUS-PHP84-SQLITE-QA.sha256
          retention-days: 1
